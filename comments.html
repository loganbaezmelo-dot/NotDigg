<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion | NotDigg</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .comment {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .comment-body {
      color: #e5e7eb;
      word-break: break-word;
    }
    .comment-body a {
      color: #60a5fa;
      text-decoration: underline;
    }
    .nested-comment {
      margin-left: 16px;
      border-left: 2px solid #3b82f6;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">notdigg</a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="meta-link" style="color: white;">← Back to feed</a>
    </div>
  </header>

  <main class="container">
    <div id="story-header" class="card" style="margin-bottom: 20px;">
      <h1 id="post-title" style="font-size: 18px; font-weight: 700;">Loading discussion...</h1>
      <p id="post-meta" class="card-snippet" style="margin-top: 6px;"></p>
    </div>

    <section id="comments-list">
      <!-- Comments inject here -->
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const storyId = urlParams.get('id');

    function renderCommentTree(comment) {
      if (!comment || !comment.text) return '';
      
      const replies = (comment.children || [])
        .map(child => `<div class="nested-comment">${renderCommentTree(child)}</div>`)
        .join('');

      return `
        <div class="comment">
          <div class="comment-header">
            <a href="profile.html?user=${comment.author}" class="meta-link">@${comment.author}</a>
            <span>${new Date(comment.created_at).toLocaleDateString()}</span>
          </div>
          <div class="comment-body">${comment.text}</div>
          ${replies}
        </div>
      `;
    }

    async function loadComments() {
      if (!storyId) {
        document.getElementById('post-title').textContent = "No story selected 😭";
        return;
      }

      try {
        const res = await fetch(`https://hn.algolia.com/api/v1/items/${storyId}`);
        const data = await res.json();

        document.getElementById('post-title').innerHTML = `
          <a href="${data.url || '#'}" target="_blank" style="color: white; text-decoration: none;">
            ${data.title} ↗
          </a>
        `;
        document.getElementById('post-meta').textContent = 
          `Posted by @${data.author} • ${data.points || 0} points • ${data.children.length} replies`;

        const container = document.getElementById('comments-list');
        if (!data.children || data.children.length === 0) {
          container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No comments on this post yet.</p>`;
          return;
        }

        container.innerHTML = data.children.map(renderCommentTree).join('');
      } catch (err) {
        document.getElementById('post-title').textContent = "Failed to load comments 😭💀";
      }
    }

    document.addEventListener('DOMContentLoaded', loadComments);
  </script>
</body>
</html>
