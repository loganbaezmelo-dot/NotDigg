<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotShovel | Tech Feed</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-left">
      <button class="icon-btn" id="menu-toggle" aria-label="Toggle menu">☰</button>
      <a href="index.html" class="logo">notshovel</a>
    </div>
    
    <div class="nav-right">
      <a href="profile.html" class="profile-link" title="My Profile / Authenticate">
        <div class="nav-avatar"></div>
      </a>
    </div>
  </header>

  <!-- Slide-out Sidebar Drawer & Overlay -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="sidebar-drawer" class="sidebar-drawer">
    <div class="drawer-header">
      <span class="logo">notshovel</span>
      <button id="close-drawer" class="icon-btn" aria-label="Close menu">✕</button>
    </div>
    
    <nav class="drawer-links">
      <a href="index.html" class="drawer-link active">🔥 Top Tech Stories</a>
      <a href="profile.html" class="drawer-link profile-link">👤 My Profile / Login</a>
      <a href="https://github.com/loganbaezmelo-dot/NotShovel" target="_blank" rel="noopener noreferrer" class="drawer-link">⭐ View Source</a>
    </nav>
    
    <div class="drawer-footer">
      <p>© 2026 NotShovel</p>
      <small>Working navigation included 💀</small>
    </div>
  </aside>

  <!-- Main Content Container -->
  <main class="container">
    
    <!-- Real-time Search Box -->
    <div style="margin-top: 14px; margin-bottom: 20px;">
      <form id="search-form" style="display: flex; gap: 8px;">
        <input 
          type="text" 
          id="search-input" 
          placeholder="🔍 Search tech stories, repos, topics..." 
          style="flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none;"
        />
        <button type="submit" class="action-btn" style="background: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer;">
          Search
        </button>
      </form>
    </div>

    <!-- Search Results Feed (Hidden by default) -->
    <div id="search-results-section" style="display: none; margin-bottom: 30px;">
      <header class="feed-header">
        <h1 id="search-header-title">Search Results</h1>
        <button id="clear-search-btn" class="action-btn" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">Clear Search ✕</button>
      </header>
      <section id="search-feed-list" class="feed-list"></section>
    </div>

    <!-- Main Live Stories Area -->
    <div id="default-feeds">
      <header class="feed-header">
        <h1>Top Tech Stories</h1>
        <span class="badge">Live Aggregator</span>
      </header>

      <section id="feed-list" class="feed-list">
        <!-- Injected via app.js -->
      </section>

      <!-- GitHub Recommendations Section -->
      <header class="feed-header" style="margin-top: 36px;">
        <h1>GitHub Recommendations & Community</h1>
        <span class="badge" style="background-color: rgba(16, 185, 129, 0.2); color: #34d399;">Active Projects</span>
      </header>

      <section id="github-feed-list" class="feed-list">
        <!-- Injected via app.js -->
      </section>
    </div>

  </main>

  <script src="app.js?v=10"></script>
</body>
</html>
