<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotDigg | Tech Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-left">
      <button class="icon-btn" id="menu-toggle" aria-label="Toggle menu">☰</button>
      <a href="index.html" class="logo">notdigg</a>
    </div>
    
    <div class="nav-right">
      <a href="profile.html?user=dang" class="profile-link" title="My Profile">
        <div class="nav-avatar"></div>
      </a>
    </div>
  </header>

  <!-- Slide-out Sidebar Drawer & Overlay -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="sidebar-drawer" class="sidebar-drawer">
    <div class="drawer-header">
      <span class="logo">notdigg</span>
      <button id="close-drawer" class="icon-btn" aria-label="Close menu">✕</button>
    </div>
    
    <nav class="drawer-links">
      <a href="index.html" class="drawer-link active">🔥 Top Tech Stories</a>
      <a href="profile.html?user=dang" class="drawer-link">👤 Featured Profile</a>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="drawer-link">⭐ View Source</a>
    </nav>
    
    <div class="drawer-footer">
      <p>© 2026 NotDigg</p>
      <small>Working navigation included 💀</small>
    </div>
  </aside>

  <!-- Main Feed Container -->
  <main class="container">
    <header class="feed-header">
      <h1>Top Tech Stories</h1>
      <span class="badge">Live Aggregator</span>
    </header>

    <section id="feed-list" class="feed-list">
      <!-- Injected via app.js -->
    </section>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
