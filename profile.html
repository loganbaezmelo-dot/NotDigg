<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | NotDigg</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 18px;
      margin-top: 15px;
      margin-bottom: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .profile-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .stats-row {
      display: flex;
      gap: 20px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .stats-row strong {
      color: var(--text-main);
    }
    .user-bio {
      margin-top: 10px;
      font-size: 13.5px;
      color: #d1d5db;
      line-height: 1.6;
      max-width: 500px;
      word-break: break-word;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">notdigg</a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="meta-link" style="color: white;">← Back to feed</a>
    </div>
  </header>

  <main class="container">
    <!-- User Profile Header -->
    <section class="profile-card" id="profile-container">
      <div class="profile-avatar" id="avatar-initial">?</div>
      <h1 id="username" style="font-size: 22px; font-weight: 700;">Loading profile...</h1>
      
      <div class="stats-row">
        <span>Karma: <strong id="karma-count">--</strong></span>
        <span>Joined: <strong id="join-date">--</strong></span>
      </div>

      <div class="user-bio" id="user-about"></div>
    </section>

    <!-- Recent Submissions -->
    <h2 class="section-title">Recent Submissions</h2>
    <section id="user-posts" class="feed-list">
      <p style="color: var(--text-muted); text-align: center;">Fetching submissions...</p>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user');

    async function loadUserProfile() {
      if (!username) {
        document.getElementById('username').textContent = "No user found 😭";
        return;
      }

      try {
        // 1. Fetch user data
        const res = await fetch(`https://hacker-news.firebaseio.com/v0/user/${username}.json`);
        const user = await res.json();

        if (!user) {
          document.getElementById('username').textContent = `@${username} (Not found)`;
          return;
        }

        // 2. Populate profile details
        document.getElementById('avatar-initial').textContent = user.id.slice(0, 2);
        document.getElementById('username').textContent = `@${user.id}`;
        document.getElementById('karma-count').textContent = Number(user.karma || 0).toLocaleString();
        
        const joinDate = new Date(user.created * 1000).toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
        document.getElementById('join-date').textContent = joinDate;

        if (user.about) {
          document.getElementById('user-about').innerHTML = user.about;
        } else {
          document.getElementById('user-about').textContent = "No bio written.";
        }

        // 3. Fetch latest submissions
        const postsContainer = document.getElementById('user-posts');
        const submittedIds = (user.submitted || []).slice(0, 8);

        if (submittedIds.length === 0) {
          postsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No recent submissions found.</p>`;
          return;
        }

        const itemFetches = submittedIds.map(id =>
          fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())
        );
        const items = await Promise.all(itemFetches);

        // Filter for stories and comments
        postsContainer.innerHTML = items
          .filter(item => item && !item.deleted && !item.dead)
          .map(item => {
            const isStory = item.type === 'story';
            const title = item.title || (item.text ? item.text.slice(0, 90) + '...' : 'Untitled Post');
            const targetUrl = isStory && item.url ? item.url : `comments.html?id=${item.id}`;

            return `
              <article class="card">
                <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="card-title">
                  ${title}
                </a>
                <div class="card-footer">
                  <span>${item.type.toUpperCase()} • ${item.score || 0} pts</span>
                  <a href="comments.html?id=${item.id}" class="meta-link">View Discussion →</a>
                </div>
              </article>
            `;
          }).join('');

      } catch (err) {
        document.getElementById('username').textContent = "Failed to load user 😭💀";
      }
    }

    document.addEventListener('DOMContentLoaded', loadUserProfile);
  </script>
</body>
</html>
