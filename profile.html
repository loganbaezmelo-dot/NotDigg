<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | NotShovel</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .profile-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 18px;
      margin-top: 15px;
      margin-bottom: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar-lg {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      background-size: cover;
      background-position: center;
      border: 2px solid #ef4444;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .stats-row strong { color: var(--text-main); }
    .user-bio {
      margin-top: 8px;
      font-size: 13.5px;
      color: #d1d5db;
      line-height: 1.6;
      max-width: 500px;
      word-break: break-word;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-top: 26px;
      margin-bottom: 12px;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">notshovel</a>
    </div>
    <div class="nav-right" style="display: flex; gap: 12px; align-items: center;">
      <a href="settings.html" class="meta-link" style="color: white;">⚙️ Settings</a>
      <a href="index.html" class="meta-link" style="color: white;">← Back</a>
    </div>
  </header>

  <main class="container">
    
    <section class="profile-card" id="profile-container">
      <div class="profile-avatar-lg" id="avatar-display">?</div>
      <h1 id="username" style="font-size: 22px; font-weight: 700; margin: 0;">Loading profile...</h1>
      
      <div class="stats-row" id="stats-container">
        <span id="gh-stat-box" style="display: none;">GitHub: <strong id="karma-count">--</strong></span>
        <span id="yt-stat-box" style="display: none;">YouTube: <strong id="yt-sub-count">--</strong></span>
      </div>

      <div class="user-bio" id="user-about"></div>

      <div id="owner-actions" style="display: none; margin-top: 10px;">
        <a href="settings.html" class="action-btn" style="font-size: 12px;">⚙️ Manage Integrations</a>
      </div>
    </section>

    <div id="youtube-section-wrapper" style="display: none;">
      <h2 class="section-title" style="color: #f87171;">📺 Linked YouTube Channel</h2>
      <section id="user-youtube-videos" class="feed-list"></section>
    </div>

    <div id="github-repos-wrapper" style="display: none;">
      <h2 class="section-title" style="color: #60a5fa;">📦 GitHub Repositories</h2>
      <section id="github-repos" class="feed-list"></section>
    </div>

    <div id="submissions-wrapper">
      <h2 class="section-title">💬 Community Activity</h2>
      <section id="user-posts" class="feed-list">
        <p style="color: var(--text-muted); text-align: center;">Fetching submissions...</p>
      </section>
    </div>

  </main>

  <script src="app.js?v=40"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let targetUser = urlParams.get('user');

    async function initProfilePage() {
      let activeUser = localStorage.getItem('notshovel_auth_user');

      if (supabaseClient) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          const meta = user.user_metadata || {};
          const identities = user.identities || [];
          const ghIdentity = identities.find(i => i.provider === 'github');
          activeUser = (ghIdentity && ghIdentity.identity_data && (ghIdentity.identity_data.user_name || ghIdentity.identity_data.preferred_username)) 
                       || meta.user_name || meta.preferred_username || user.email.split('@')[0];
          localStorage.setItem('notshovel_auth_user', activeUser);
        }
      }

      if (!targetUser) {
        targetUser = activeUser;
      }

      if (!targetUser) {
        window.location.href = "login.html";
        return;
      }

      const cleanTarget = targetUser.replace(/^@/, '');
      const isOwnProfile = activeUser && (cleanTarget.toLowerCase() === activeUser.toLowerCase());
      if (isOwnProfile) {
        document.getElementById('owner-actions').style.display = "block";
      }

      loadMergedProfile(cleanTarget, isOwnProfile);
    }

    async function loadMergedProfile(userHandle, isOwnProfile) {
      const avatarEl = document.getElementById('avatar-display');
      const ghStatBox = document.getElementById('gh-stat-box');
      const karmaEl = document.getElementById('karma-count');
      const ytStatBox = document.getElementById('yt-stat-box');
      const ytSubEl = document.getElementById('yt-sub-count');
      const aboutEl = document.getElementById('user-about');
      const reposContainer = document.getElementById('github-repos');
      const reposWrapper = document.getElementById('github-repos-wrapper');
      const ytWrapper = document.getElementById('youtube-section-wrapper');
      const ytContainer = document.getElementById('user-youtube-videos');

      document.getElementById('username').textContent = `@${userHandle}`;

      // 1. Fetch GitHub
      try {
        const ghRes = await fetch(`https://api.github.com/users/${userHandle}`);
        if (ghRes.ok) {
          const ghUser = await ghRes.json();
          // Initial avatar set from GitHub
          avatarEl.style.backgroundImage = `url('${ghUser.avatar_url}')`;
          avatarEl.textContent = "";
          ghStatBox.style.display = "inline";
          karmaEl.textContent = `${ghUser.public_repos} Repos • ${ghUser.followers} Followers`;
          aboutEl.textContent = ghUser.bio || "Active developer on NotShovel.";

          const reposRes = await fetch(`https://api.github.com/users/${userHandle}/repos?sort=updated&per_page=6`);
          const repos = await reposRes.json();
          if (Array.isArray(repos) && repos.length > 0) {
            reposWrapper.style.display = "block";
            reposContainer.innerHTML = repos.map(repo => `
              <article class="card">
                <a href="repo.html?owner=${encodeURIComponent(userHandle)}&repo=${encodeURIComponent(repo.name)}" class="card-title">
                  📦 ${repo.name}
                </a>
                <p class="card-snippet">${repo.description || "No description provided."}</p>
                <div class="card-footer">
                  <span>⭐ ${repo.stargazers_count} stars • 🍴 ${repo.forks_count} forks</span>
                  <a href="repo.html?owner=${encodeURIComponent(userHandle)}&repo=${encodeURIComponent(repo.name)}" class="meta-link">Read Project →</a>
                </div>
              </article>
            `).join('');
          }
        }
      } catch (e) {
        console.warn("GitHub fetch error:", e);
      }

      // 2. Query Supabase profiles table
      let channelIdentifier = userHandle;

      if (supabaseClient) {
        try {
          const { data: dbProfile } = await supabaseClient
            .from('profiles')
            .select('youtube_channel')
            .or(`github_username.ilike.${userHandle},google_email.ilike.${userHandle}%,display_name.ilike.${userHandle}`)
            .maybeSingle();

          if (dbProfile && dbProfile.youtube_channel) {
            channelIdentifier = dbProfile.youtube_channel;
          }
        } catch (err) {
          console.warn("DB lookup error:", err);
        }
      }

      // 3. Resolve & Render YouTube Channel (With Unified Avatar Sync)
      try {
        const apiKey = getYTKey();
        let chanData = null;
        const cleanChan = channelIdentifier.trim();

        // Strategy A: Direct Channel ID (UC...)
        if (cleanChan.startsWith("UC")) {
          const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${encodeURIComponent(cleanChan)}&key=${apiKey}`);
          chanData = await res.json();
        }

        // Strategy B: Handle lookup (@...)
        if (!chanData || !chanData.items || chanData.items.length === 0) {
          const handleQuery = cleanChan.startsWith("@") ? cleanChan : `@${cleanChan}`;
          const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&forHandle=${encodeURIComponent(handleQuery)}&key=${apiKey}`);
          chanData = await res.json();
        }

        // Strategy C: Search Fallback
        if (!chanData || !chanData.items || chanData.items.length === 0) {
          const sRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(cleanChan)}&type=channel&maxResults=1&key=${apiKey}`);
          const sData = await sRes.json();
          if (sData.items && sData.items.length > 0) {
            const foundId = sData.items[0].snippet.channelId;
            const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${foundId}&key=${apiKey}`);
            chanData = await res.json();
          }
        }

        if (chanData && chanData.items && chanData.items.length > 0) {
          const chan = chanData.items[0];
          ytStatBox.style.display = "inline";
          ytSubEl.textContent = `${Number(chan.statistics.subscriberCount || 0).toLocaleString()} Subs`;
          ytWrapper.style.display = "block";

          // UNIFIED AVATAR OVERRIDE: Priority for YouTube channel custom PFP
          const ytAvatar = chan.snippet.thumbnails.high ? chan.snippet.thumbnails.high.url : chan.snippet.thumbnails.default.url;
          if (ytAvatar) {
            avatarEl.style.backgroundImage = `url('${ytAvatar}')`;
            avatarEl.textContent = "";

            if (isOwnProfile) {
              const navAvatars = document.querySelectorAll('.nav-avatar');
              navAvatars.forEach(av => {
                av.style.backgroundImage = `url('${ytAvatar}')`;
                av.style.backgroundSize = 'cover';
              });
            }
          }

          // 1-Unit Uploads Playlist Resolution
          let uploadsPlaylistId = chan.contentDetails && chan.contentDetails.relatedPlaylists && chan.contentDetails.relatedPlaylists.uploads;
          if (!uploadsPlaylistId && chan.id.startsWith("UC")) {
            uploadsPlaylistId = "UU" + chan.id.substring(2);
          }

          if (uploadsPlaylistId) {
            const pRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsPlaylistId}&maxResults=4&key=${apiKey}`);
            const pData = await pRes.json();

            if (pData.items && pData.items.length > 0) {
              ytContainer.innerHTML = pData.items
                .filter(item => item.snippet && item.snippet.resourceId && item.snippet.resourceId.videoId)
                .map(item => `
                  <article class="card">
                    <a href="video.html?v=${item.snippet.resourceId.videoId}" class="card-title">
                      ▶️ ${item.snippet.title}
                    </a>
                    <p class="card-snippet">${item.snippet.description || "Uploaded video."}</p>
                    <div class="card-footer">
                      <span>Published ${new Date(item.snippet.publishedAt).toLocaleDateString()}</span>
                      <a href="video.html?v=${item.snippet.resourceId.videoId}" class="meta-link" style="color: #ef4444;">Watch in App →</a>
                    </div>
                  </article>
                `).join('');
            } else {
              ytContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No video uploads found.</p>`;
            }
          }
        } else {
          ytStatBox.style.display = "none";
          ytWrapper.style.display = "none";
        }
      } catch (err) {
        console.warn("YouTube channel error:", err);
        ytStatBox.style.display = "none";
        ytWrapper.style.display = "none";
      }

      // 4. Submissions
      loadCommunityPosts(userHandle);
    }

    async function loadCommunityPosts(userHandle) {
      const postsContainer = document.getElementById('user-posts');
      try {
        const res = await fetch(`https://hacker-news.firebaseio.com/v0/user/${userHandle}.json`);
        const user = await res.json();
        if (user && user.submitted && user.submitted.length > 0) {
          const items = await Promise.all(user.submitted.slice(0, 4).map(id =>
            fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())
          ));
          postsContainer.innerHTML = items.filter(i => i && !i.deleted).map(item => `
            <article class="card">
              <a href="comments.html?id=${item.id}" class="card-title">${item.title || 'Discussion post'}</a>
              <div class="card-footer">
                <span>${item.score || 0} pts</span>
                <a href="comments.html?id=${item.id}" class="meta-link">View Discussion →</a>
              </div>
            </article>
          `).join('');
        } else {
          postsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No recent submissions found.</p>`;
        }
      } catch (e) {
        postsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Activity currently quiet.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initProfilePage);
  </script>
</body>
</html>
