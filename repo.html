<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository View | NotShovel</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .repo-header {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-top: 15px;
      margin-bottom: 20px;
    }
    .repo-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .file-tree-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      max-height: 260px;
      overflow-y: auto;
    }
    .file-item {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.15s;
    }
    .file-item:hover {
      background: var(--bg-card-hover);
    }
    .file-item:last-child {
      border-bottom: none;
    }
    .code-viewer-box {
      background-color: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .code-viewer-box pre {
      margin: 0;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .readme-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      color: #e5e7eb;
      line-height: 1.6;
      word-break: break-word;
    }
    .readme-box pre {
      background: #121214;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }
    .readme-box code {
      font-family: monospace;
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">notshovel</a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="meta-link" style="color: white;">← Back to feed</a>
    </div>
  </header>

  <main class="container">
    
    <!-- Repository Details Header -->
    <div class="repo-header" id="repo-header">
      <h1 id="repo-title" style="font-size: 20px; font-weight: 700;">Loading repository...</h1>
      <p id="repo-desc" style="color: var(--text-muted); font-size: 14px; margin-top: 6px;"></p>
      <div class="repo-stats" id="repo-stats"></div>
    </div>

    <!-- Live Code / File Content Display -->
    <div id="file-content-section" style="display: none; margin-bottom: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h2 id="opened-file-name" style="font-size: 15px; font-weight: 700; color: #60a5fa; font-family: monospace;">Viewing file</h2>
        <button id="close-file-btn" class="action-btn" style="padding: 4px 10px; font-size: 12px; cursor: pointer;">Close File ✕</button>
      </div>
      <section class="code-viewer-box">
        <pre><code id="raw-code-block"></code></pre>
      </section>
    </div>

    <!-- Repository File Structure -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2 style="font-size: 16px; font-weight: 700; color: var(--text-main);" id="tree-heading">📁 Files</h2>
      <button id="folder-back-btn" class="action-btn" style="display: none; padding: 4px 10px; font-size: 12px; cursor: pointer;">↑ Up Directory</button>
    </div>

    <section class="file-tree-box" id="file-list">
      <p style="color: var(--text-muted); text-align: center; padding: 12px;">Loading files...</p>
    </section>

    <!-- In-App README Viewer -->
    <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">📄 README.md</h2>
    <section class="readme-box" id="readme-content">
      <p style="color: var(--text-muted); text-align: center;">Fetching README...</p>
    </section>

  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const owner = urlParams.get('owner');
    const repo = urlParams.get('repo');
    let currentPath = "";

    async function loadRepoViewer() {
      const titleEl = document.getElementById('repo-title');
      const descEl = document.getElementById('repo-desc');
      const statsEl = document.getElementById('repo-stats');
      const readmeEl = document.getElementById('readme-content');

      if (!owner || !repo) {
        titleEl.textContent = "No repository specified.";
        readmeEl.innerHTML = `<p style="color: #ef4444; text-align: center;">Missing repository parameters 😭</p>`;
        return;
      }

      titleEl.textContent = `📦 ${owner} / ${repo}`;

      // 1. Fetch Repo Metadata
      try {
        const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
        if (repoRes.ok) {
          const data = await repoRes.json();
          descEl.textContent = data.description || "No description provided.";
          statsEl.innerHTML = `
            <span>⭐ <strong>${data.stargazers_count.toLocaleString()}</strong> stars</span>
            <span>🍴 <strong>${data.forks_count.toLocaleString()}</strong> forks</span>
            <span>👀 <strong>${data.subscribers_count || 0}</strong> watchers</span>
            <span>Branch: <strong>${data.default_branch}</strong></span>
          `;
        }
      } catch (e) {
        console.warn("Could not fetch repo metadata", e);
      }

      // 2. Fetch Directory Tree
      loadDirectoryTree("");

      // 3. Fetch README
      try {
        const readmeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/readme`, {
          headers: { "Accept": "application/vnd.github.v3.raw" }
        });

        if (readmeRes.ok) {
          const markdownText = await readmeRes.text();
          readmeEl.innerHTML = marked.parse(markdownText);
          readmeEl.querySelectorAll('a').forEach(a => a.removeAttribute('target'));
        } else {
          readmeEl.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No README.md found in this repository.</p>`;
        }
      } catch (err) {
        readmeEl.innerHTML = `<p style="color: #ef4444; text-align: center;">Failed to load README: ${err.message} 😭</p>`;
      }
    }

    async function loadDirectoryTree(path) {
      const fileListEl = document.getElementById('file-list');
      const backBtn = document.getElementById('folder-back-btn');
      const heading = document.getElementById('tree-heading');

      currentPath = path;
      heading.textContent = path ? `📁 Files: /${path}` : "📁 Root Files";
      backBtn.style.display = path ? "inline-block" : "none";
      fileListEl.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 8px;">Loading directory contents...</p>`;

      try {
        const url = path 
          ? `https://api.github.com/repos/${owner}/${repo}/contents/${path}`
          : `https://api.github.com/repos/${owner}/${repo}/contents`;

        const res = await fetch(url);
        if (res.ok) {
          const items = await res.json();
          if (Array.isArray(items)) {
            // Sort folders first, then files
            items.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1));

            fileListEl.innerHTML = items.map(item => `
              <div class="file-item" onclick="handleItemClick('${item.type}', '${item.path}', '${item.name}')">
                <span>${item.type === 'dir' ? '📁' : '📄'}</span>
                <span style="font-family: monospace; font-size: 13px;">${item.name}</span>
              </div>
            `).join('');
          }
        } else {
          fileListEl.innerHTML = `<p style="color: var(--text-muted); font-size: 13px; text-align: center;">Empty directory.</p>`;
        }
      } catch (err) {
        fileListEl.innerHTML = `<p style="color: #ef4444; font-size: 13px; text-align: center;">Failed to load contents.</p>`;
      }
    }

    function handleItemClick(type, path, name) {
      if (type === 'dir') {
        loadDirectoryTree(path);
      } else {
        openFileViewer(path, name);
      }
    }

    document.getElementById('folder-back-btn').onclick = () => {
      const parts = currentPath.split('/');
      parts.pop();
      loadDirectoryTree(parts.join('/'));
    };

    async function openFileViewer(filePath, fileName) {
      const section = document.getElementById('file-content-section');
      const title = document.getElementById('opened-file-name');
      const codeBlock = document.getElementById('raw-code-block');

      section.style.display = "block";
      title.textContent = `📄 ${fileName}`;
      codeBlock.textContent = "Loading file content...";
      section.scrollIntoView({ behavior: 'smooth' });

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
          headers: { "Accept": "application/vnd.github.v3.raw" }
        });

        if (res.ok) {
          const content = await res.text();
          codeBlock.textContent = content;
        } else {
          codeBlock.textContent = "Unable to preview binary or protected file.";
        }
      } catch (err) {
        codeBlock.textContent = `Error reading file: ${err.message}`;
      }
    }

    document.getElementById('close-file-btn').onclick = () => {
      document.getElementById('file-content-section').style.display = "none";
    };

    document.addEventListener('DOMContentLoaded', loadRepoViewer);
  </script>
</body>
</html>
